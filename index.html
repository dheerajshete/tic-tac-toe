<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 35px;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at top left, #312e81, transparent 35%),
                radial-gradient(circle at bottom right, #701a75, transparent 35%),
                #09090f;
        }

        .game {
            width: 380px;
            max-width: 92%;
            text-align: center;

            padding: 30px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .game h1 {
            margin-bottom: 15px;
            font-size: 34px;
            letter-spacing: 2px;
        }

        #turn {
            margin-bottom: 25px;
            font-size: 18px;
            color: #c4b5fd;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);

            gap: 10px;
            justify-content: center;
            margin: auto;
        }

        .cell {
            font-size: 40px;
            font-weight: bold;

            border: 1px solid rgba(167, 139, 250, 0.5);
            border-radius: 15px;

            background: rgba(255, 255, 255, 0.06);
            color: white;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .cell:hover {
            background: rgba(139, 92, 246, 0.25);
            transform: scale(1.05);

            box-shadow:
                0 0 20px rgba(139, 92, 246, 0.35);
        }

        .cell:disabled {
            cursor: not-allowed;
            opacity: 1;
        }

        #result {
            min-height: 28px;
            margin: 20px 0;
        }

        #restart {
            margin-top: 25px;

            padding: 13px 25px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(139, 92, 246, 0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #restart:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(236, 72, 153, 0.45);
        }

        #restart:active {
            transform: translateY(0);
        }

        #Winner {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 280px;
            min-height: 75px;

            padding: 15px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);

            transition: 0.3s ease;
        }

        #Winner:hover {
            transform: scale(1.05);

            box-shadow:
                0 20px 50px rgba(139, 92, 246, 0.25);
        }

        #winner_text {
            color: #c4b5fd;
            font-size: 28px;
        }

        @media (max-width: 400px) {

            .game {
                padding: 22px;
            }

            .game h1 {
                font-size: 28px;
            }

            .board {
                grid-template-columns: repeat(3, 75px);
                grid-template-rows: repeat(3, 75px);
                gap: 8px;
            }

            .cell {
                font-size: 32px;
                border-radius: 12px;
            }

            #Winner {
                width: 240px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Tic-Tac-Toe</h1>

        <h2 id="turn">Player 1's Turn</h2>

        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>

        <h2 id="result"></h2>

        <button id="restart" onclick="reset()">Restart Game</button>

    </div>

    <div id="Winner">
        <h1 id="winner_text">Winner</h1>
    </div>

    <script>
        let cells = document.getElementsByClassName("cell");
        let winner = document.getElementById("winner_text");
        let turn = document.getElementById("turn");
        let j = 0;
        let game_over = false;
        let winning = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];
        for(let i = 0; i < cells.length; i++){

            cells[i].onclick = function(){
                if(game_over == true){
                return;
            }
            
            if(j%2 == 0){
                turn.innerText = `Player 2's Turn`;
                cells[i].innerText = "X";
                cells[i].disabled = true;
                for(let k = 0; k < winning.length; k++){
                    if(cells[winning[k][0]].innerText == "X" &&
                       cells[winning[k][1]].innerText == "X" &&
                       cells[winning[k][2]].innerText == "X"){
                        winner.innerHTML = `<h1 id= "winner_text" style="color: blue; font-size: 30px;">Player 1</h1>`;
                        turn.innerText = `Game over`;
                        game_over = true;
                        }
                    }
            }
            
            else{   
                turn.innerText = `Player 1's Turn`;
                cells[i].innerText = "O";
                cells[i].disabled = true;
                for(let k = 0; k < winning.length; k++){
                    if(cells[winning[k][0]].innerText == "O" &&
                       cells[winning[k][1]].innerText == "O" &&
                       cells[winning[k][2]].innerText == "O"){
                        winner.innerHTML = `<h1 id= "winner_text" style="color: blue; font-size: 30px;">Player 2</h1>`;
                        turn.innerText = `Game over`;
                        game_over = true;
                        }
                    }
            }
            if(j == 8 && !game_over){
                 winner.innerHTML = `<h1 id= "winner_text" style="color: blue; font-size: 30px;">Draw</h1>`;
                        turn.innerText = `Game over`;
                        game_over = true;
            }
            j++;
            }
    }
    function reset(){
        location.reload();
    }
    </script>
</body>
</html>
